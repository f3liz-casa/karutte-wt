<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>{{ROOM}} · heya</title>
<style>
  :root { color-scheme: dark; --bg: #111418; --tile: #1c2128; --tile2: #232a33; --fg: #e8ebef; --dim: #8b949e; --ring: #4cc38a; --red: #e5484d; --btn: #2d333b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body { font: 16px/1.5 system-ui, -apple-system, "Hiragino Sans", sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* ロビー(入る前) */
  #lobby { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem;
           padding-top: max(1.5rem, env(safe-area-inset-top)); padding-bottom: max(1.5rem, env(safe-area-inset-bottom)); }
  #lobby h1 { font-weight: 500; font-size: 1.4rem; margin: 0; }
  #lobby .hint { color: var(--dim); font-size: .95rem; text-align: center; max-width: 24rem; margin: 0; }
  #lobby input { font: inherit; font-size: 1.1rem; padding: .8rem 1rem; width: min(22rem, 100%); border-radius: 12px; border: 1px solid #3a424c; background: var(--tile); color: var(--fg); text-align: center; }
  #lobby input:focus { outline: 2px solid var(--ring); border-color: transparent; }
  #join { font-size: 1.1rem; font-weight: 600; padding: .95rem 2.4rem; border-radius: 999px; background: var(--ring); color: #06210f; width: min(22rem, 100%); }
  #join:disabled { opacity: .6; cursor: default; }
  #join:active { transform: scale(.98); }
  #lobby .admin { color: var(--dim); font-size: .85rem; margin-top: 1rem; text-align: center; }
  #lobby .admin form { display: inline; } #lobby .admin button { background: none; text-decoration: underline; padding: 0; color: var(--dim); }

  /* 通話 */
  #call { position: fixed; inset: 0; display: none; flex-direction: column; }
  #call.on { display: flex; }
  #top { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; padding-top: max(.6rem, env(safe-area-inset-top)); color: var(--dim); font-size: .92rem; }
  #top .room { color: var(--fg); font-weight: 500; }
  #top .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--ring); flex: none; }
  #top .dot.off { background: var(--red); }
  #top .clock { margin-left: auto; font-variant-numeric: tabular-nums; }
  #grid { flex: 1; display: grid; gap: .6rem; padding: .4rem .8rem; align-content: center; justify-content: center;
          grid-template-columns: repeat(auto-fit, minmax(min(100%, 9.5rem), 1fr)); overflow: auto; }
  .tile { position: relative; background: var(--tile); border-radius: 16px; aspect-ratio: 4 / 3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem;
          outline: 3px solid transparent; transition: outline-color .15s; min-height: 6.5rem; }
  .tile.talking { outline-color: var(--ring); }
  .tile .avatar { width: 3.6rem; height: 3.6rem; border-radius: 50%; background: var(--tile2); display: grid; place-items: center; font-size: 1.4rem; font-weight: 600; }
  .tile.talking .avatar { box-shadow: 0 0 0 6px rgba(76,195,138,.25); }
  .tile .name { font-size: .95rem; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .name small { color: var(--dim); font-weight: normal; margin-left: .3rem; }
  .tile .muted { position: absolute; top: .55rem; right: .6rem; color: var(--dim); display: flex; }
  #bar { display: flex; justify-content: center; align-items: flex-start; gap: 1.5rem; padding: 1rem 1rem 1.6rem; padding-bottom: max(1.6rem, calc(env(safe-area-inset-bottom) + 1.2rem)); }
  .wrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: .35rem; }
  .round { width: 3.8rem; height: 3.8rem; border-radius: 50%; background: var(--btn); display: grid; place-items: center; }
  .round:active { transform: scale(.95); }
  .round svg { width: 1.5rem; height: 1.5rem; fill: currentColor; }
  .round.on { background: var(--fg); color: #111; }
  .round.leave { background: var(--red); color: #fff; width: 4.6rem; }
  .label { font-size: .72rem; color: var(--dim); white-space: nowrap; }
  #toast { position: fixed; left: 50%; bottom: 8.5rem; transform: translateX(-50%); background: #2d333b; padding: .6rem 1rem; border-radius: 10px; font-size: .9rem; max-width: 90%; display: none; }
  #toast.show { display: block; }
  #lost { position: fixed; inset: 0; background: rgba(17,20,24,.92); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem; text-align: center; }
  #lost.show { display: flex; }
  #lost button { padding: .8rem 1.8rem; border-radius: 999px; background: var(--ring); color: #06210f; font-weight: 600; }
  @media (min-width: 700px) {
    #grid { padding: 1rem 2rem; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); max-width: 64rem; margin: 0 auto; width: 100%; }
    .tile .avatar { width: 4.6rem; height: 4.6rem; font-size: 1.8rem; }
  }
</style>

<section id="lobby">
  <h1>{{ROOM}}</h1>
  <p class="hint">声だけの部屋です。名前を入れて参加すると、マイクの許可を訊かれます。ヘッドホンがあると、相手に自分の声が戻りません。</p>
  <input id="name" placeholder="なまえ" autocomplete="nickname" enterkeyhint="go">
  <button id="join">参加する</button>
  <p class="hint" id="nowt" hidden>このブラウザでは声の道(WebTransport)が開けません。新しめの Chrome / Firefox / Safari 26.4 以降で開いてください。</p>
  <div class="admin">{{ADMIN}}</div>
</section>

<section id="call">
  <div id="top"><span class="dot" id="dot"></span><span class="room">{{ROOM}}</span><span id="count"></span><span class="clock" id="clock">00:00</span></div>
  <div id="grid"></div>
  <div id="bar">
    <div class="wrap"><button class="round" id="mute" aria-label="ミュート" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg></button><span class="label" id="mutelabel">ミュート</span></div>
    <div class="wrap"><button class="round leave" id="leave" aria-label="退出"><svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.1-.7-.28a11.27 11.27 0 0 0-2.66-1.85.99.99 0 0 1-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button><span class="label">退出</span></div>
  </div>
</section>
<div id="toast"></div>
<div id="lost"><p>部屋との道が切れました。</p><button id="rejoin">入り直す</button></div>

<script>
// 声の部屋のクライアント。マイク → 16k PCM 20ms → WebTransport datagram。
// 返ってくるのは <<id, pcm>>(自分以外)と <<0, json>>(だれが居るか)。
const ROOM = "{{ROOM}}", WT_URL = "{{WT_URL}}", HASH = "{{HASH}}";
const $ = s => document.querySelector(s);
let wt, ctx, writer, me = 0, members = new Map(), talking = new Map(), muted = false, started = 0, wake = null, myName = "";
const stats = new Map();   // id → {n, last, maxgap, late}: 届きかたを見るため(とぎれの切り分け)

const toast = (t, ms = 2500) => { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), ms); };
const log = t => console.log("[heya]", t);

// 送る側: 128 サンプルの render quantum を 320 にまとめて Int16 で出す。声の大きさも一緒に(自分のタイルを光らせる)
const SENDER = `
class Sender extends AudioWorkletProcessor {
  constructor() { super(); this.buf = new Float32Array(320); this.n = 0; }
  process(inputs) {
    const ch = inputs[0][0]; if (!ch) return true;
    for (let i = 0; i < ch.length; i++) {
      this.buf[this.n++] = ch[i];
      if (this.n === 320) {
        const out = new Int16Array(320); let loud = 0;
        for (let k = 0; k < 320; k++) { out[k] = Math.max(-1, Math.min(1, this.buf[k])) * 32767; if (k % 8 === 0) loud += Math.abs(this.buf[k]); }
        this.port.postMessage({ pcm: out.buffer, loud }, [out.buffer]); this.n = 0;
      }
    }
    return true;
  }
}
registerProcessor("sender", Sender);`;

// 鳴らす側: 参加者ごとの列から 128 ずつ取って足す(無ければ 0)。
// 列が空から始まるときは 5 包み(100ms)溜まるまで待ってから鳴らす(遅れた枠がそのまま穴にならないように)
const PLAYER = `
class Player extends AudioWorkletProcessor {
  constructor() { super(); this.q = new Map(); this.ready = new Map(); this.port.onmessage = e => {
    const { id, pcm } = e.data; if (!this.q.has(id)) { this.q.set(id, []); this.ready.set(id, false); }
    this.q.get(id).push(new Float32Array(pcm)); }; }
  process(_, outputs) {
    const out = outputs[0][0]; out.fill(0);
    for (const [id, list] of this.q) {
      if (!this.ready.get(id)) { if (list.length >= 5) this.ready.set(id, true); else continue; }
      if (list.length === 0) { this.ready.set(id, false); continue; }
      let need = out.length, at = 0;
      while (need > 0 && list.length) {
        const head = list[0], take = Math.min(need, head.length);
        for (let i = 0; i < take; i++) out[at + i] += head[i];
        if (take === head.length) list.shift(); else list[0] = head.subarray(take);
        at += take; need -= take;
      }
    }
    return true;
  }
}
registerProcessor("player", Player);`;

const blob = s => URL.createObjectURL(new Blob([s], { type: "application/javascript" }));

async function join() {
  myName = $("#name").value.trim() || "だれか";
  try { localStorage.setItem("heya.name", myName); } catch {}
  $("#join").disabled = true; $("#join").textContent = "つないでいます…";

  // 音の道は、ボタンの中で開く(スマホは操作の中でしか音を出せない)
  ctx = new AudioContext({ sampleRate: 16000 }); ctx.resume().catch(() => {});   // 待たない(音の出口が無い環境では戻ってこない)
  await ctx.audioWorklet.addModule(blob(SENDER)); await ctx.audioWorklet.addModule(blob(PLAYER));
  const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });

  const opts = HASH ? { serverCertificateHashes: [{ algorithm: "sha-256", value: Uint8Array.from(atob(HASH), c => c.charCodeAt(0)) }] } : {};
  wt = new WebTransport(`${WT_URL}/${encodeURIComponent(ROOM)}?name=${encodeURIComponent(myName)}`, opts);
  await wt.ready;
  writer = wt.datagrams.writable.getWriter();
  // 既定は 1。次の枠が来る前に読めていないと落ちる(声がとぎれる)。writer/reader を作ったあとに書かないと戻る
  const hwm = () => { try { wt.datagrams.incomingHighWaterMark = 256; wt.datagrams.outgoingHighWaterMark = 256; } catch {} };
  hwm();

  const sender = new AudioWorkletNode(ctx, "sender"); ctx.createMediaStreamSource(mic).connect(sender);
  sender.port.onmessage = e => {
    if (muted) return;
    if (e.data.loud > 1) talking.set(me, Date.now());
    writer.write(new Uint8Array(e.data.pcm)).catch(() => {});
  };
  const player = new AudioWorkletNode(ctx, "player"); player.connect(ctx.destination);

  $("#lobby").style.display = "none"; $("#call").classList.add("on"); started = Date.now(); render();
  try { wake = await navigator.wakeLock?.request("screen"); } catch {}
  document.addEventListener("visibilitychange", async () => { if (document.visibilityState === "visible") try { wake = await navigator.wakeLock?.request("screen"); } catch {} });

  (async () => {
    const reader = wt.datagrams.readable.getReader();
    hwm();
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      try {
        const id = value[0];
        if (id === 0) { control(JSON.parse(new TextDecoder().decode(value.subarray(1)))); continue; }
        // 1 バイト目が id なので、そのままだと Int16 の並びがずれる。写してそろえる
        const bytes = value.slice(1);
        const i16 = new Int16Array(bytes.buffer, 0, bytes.byteLength >> 1);
        const f32 = new Float32Array(i16.length); for (let k = 0; k < i16.length; k++) f32[k] = i16[k] / 32768;
        const now = performance.now(); const st = stats.get(id) || { n: 0, last: now, maxgap: 0, late: 0 };
        const gap = now - st.last; st.n++; st.last = now; if (st.n > 1) { st.maxgap = Math.max(st.maxgap, gap); if (gap > 60) st.late++; } stats.set(id, st);
        let loud = 0; for (let k = 0; k < f32.length; k += 8) loud += Math.abs(f32[k]);
        if (loud > 1) talking.set(id, Date.now());
        player.port.postMessage({ id, pcm: f32.buffer }, [f32.buffer]);
      } catch (e) { log("枠を読めなかった: " + e.message); }
    }
    lost();
  })();
  wt.closed.then(lost, lost);
  setInterval(render, 250);
}

function lost() {
  if (!$("#call").classList.contains("on")) return;
  $("#dot").classList.add("off"); $("#lost").classList.add("show");
}

function control(m) {
  if (m.you) { me = m.you; members = new Map(m.members.map(x => [x.id, x.name])); }
  if (m.join) { members.set(m.join.id, m.join.name); toast(m.join.name + " が入りました"); }
  if (m.leave) { const n = members.get(m.leave); members.delete(m.leave); if (n) toast(n + " が出ました"); }
  render();
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const initial = n => esc([...String(n)][0] || "?");
const MUTED_ICON = `<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M19 11h-1.7a5.3 5.3 0 0 1-.4 1.9l1.5 1.5A7 7 0 0 0 19 11zM4.3 3 3 4.3 8.9 10.2V11a3 3 0 0 0 4.5 2.6l1.6 1.6A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.9V21h2v-3.1c.9-.1 1.8-.4 2.6-.9l4.1 4.1 1.3-1.3L4.3 3zM12 2a3 3 0 0 0-3 3v.2l6 6V5a3 3 0 0 0-3-3z"/></svg>`;
function render() {
  const now = Date.now();
  const list = [...members].sort(([a], [b]) => (a === me ? -1 : b === me ? 1 : a - b));
  if (!list.length) list.push([me, myName]);
  $("#grid").innerHTML = list.map(([id, n]) => `
    <div class="tile ${now - (talking.get(id) || 0) < 600 ? "talking" : ""}">
      <div class="avatar">${initial(n)}</div>
      <div class="name">${esc(n)}${id === me ? "<small>あなた</small>" : ""}</div>
      ${id === me && muted ? `<span class="muted" title="ミュート中">${MUTED_ICON}</span>` : ""}
    </div>`).join("");
  $("#count").textContent = members.size ? `${members.size} 人` : "";
  const s = Math.max(0, Math.floor((now - started) / 1000));
  $("#clock").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}

const MIC_ICON = $("#mute").innerHTML;
function setMute(on) {
  muted = on;
  $("#mute").classList.toggle("on", on);
  $("#mute").innerHTML = on ? MUTED_ICON.replace('width="18" height="18"', "") : MIC_ICON;
  $("#mute").setAttribute("aria-pressed", String(on));
  $("#mutelabel").textContent = on ? "ミュート中" : "ミュート";
  toast(on ? "マイクを切りました" : "マイクをつけました", 1200);
  render();
}

$("#join").onclick = () => join().catch(e => { $("#join").disabled = false; $("#join").textContent = "参加する"; toast("入れなかった: " + e.message, 5000); log(e); });
$("#name").addEventListener("keydown", e => { if (e.key === "Enter") $("#join").click(); });
$("#mute").onclick = () => setMute(!muted);
$("#leave").onclick = () => { try { wt?.close(); } catch {} try { ctx?.close(); } catch {} location.reload(); };
$("#rejoin").onclick = () => location.reload();
document.addEventListener("keydown", e => { if (e.key === "m" && $("#call").classList.contains("on") && document.activeElement.tagName !== "INPUT") setMute(!muted); });

try { $("#name").value = localStorage.getItem("heya.name") || ""; } catch {}
if (!("WebTransport" in window)) { $("#nowt").hidden = false; $("#join").disabled = true; }
</script>
